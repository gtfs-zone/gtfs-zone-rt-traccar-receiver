[project]
name = "vehicle-poser"
version = "0.1.1"
requires-python = ">=3.13"
description = "Bridges OwnTracks MQTT location events to Redis"
dependencies = [
    "aiomqtt>=2.3",
    "redis[hiredis]>=5.2",
]

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_poser"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TCH", "RUF"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
