[project]
name = "vehicle-poser"
version = "0.1.1"
requires-python = ">=3.13"
description = "Bridges Traccar HTTP position forwards to Redis"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psycopg2-binary>=2.9",
    "redis[hiredis]>=5.2",
    "sqlmodel>=0.0.21",
    "railroad-club",
]

[tool.uv.sources]
railroad-club = { git = "https://git.kcfam.us/gtfs.zone/railroad-club.git" }

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_poser"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
