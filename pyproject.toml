[project]
name = "gtfs-zone-rt-traccar-receiver"
version = "0.2.1"
requires-python = ">=3.13"
description = "Bridges Traccar HTTP position forwards to Redis"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psycopg2-binary>=2.9",
    "redis[hiredis]>=5.2",
    "sqlmodel>=0.0.21",
    "gtfs-zone-db-models",
]

[tool.uv.sources]
gtfs-zone-db-models = { git = "https://github.com/gtfs-zone/gtfs-zone-db-models.git", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "commitizen",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_rt_traccar_receiver"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
annotated_tag = true
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]
