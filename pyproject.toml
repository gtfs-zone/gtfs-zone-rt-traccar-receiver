[project]
name = "owntrack-redis-bridge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.3",
    "redis[hiredis]>=5.2",
]

[dependency-groups]
dev = [
    "commitizen",
    "pre-commit",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
