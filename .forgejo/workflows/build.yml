name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: alpine-3.23

    steps:
      - name: Install dependencies
        run: apk add --no-cache docker-cli docker-cli-buildx git nodejs

      - name: Checkout
        uses: actions/checkout@v6
        with:
          github-server-url: https://git.kcfam.us

      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login git.kcfam.us -u maxtkc --password-stdin

      - name: Build and push
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE=git.kcfam.us/gtfs.zone/vehicle-poser
          TAGS="-t $IMAGE:$SHA -t $IMAGE:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${{ github.ref_name }}"
          fi
          docker build $TAGS .
          docker push --all-tags $IMAGE
